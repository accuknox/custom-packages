name: Release Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Package version"
        type: "string"
      package_name:
        description: "Package name"
        type: "string"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_AUTHTOK }}

      - uses: oras-project/setup-oras@v1
        name: Setup ORAS CLI

      - name: Setup
        run: |
          mkdir -p $HOME/.ssh
          echo "${{ secrets.PROFILING_VM_SSH_KEY }}" > $HOME/.ssh/id_rsa
          chmod 600 $HOME/.ssh/id_rsa
          ssh-keyscan -p 18022 vm.accuknox.com

      - name: Publish from workflow dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          VERSION=${{ inputs.tag }} SSH_KEY=$HOME/.ssh/id_rsa PKG_NAME=idt .github/scripts/idt-release.sh

      - name: Publish from release
        if: ${{ github.event_name == 'release' }}
        run: |
          VERSION=${{ github.event.release.tag_name }} SSH_KEY=~/.ssh/id_rsa PKG_NAME=idt .github/scripts/idt-release.sh

      - name: Cleanup
        run: |
          rm -rf ~/.ssh/id_rsa
